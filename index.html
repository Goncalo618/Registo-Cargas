<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Branquinho &amp; Mesquita - Registo de Cargas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:700px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.company{text-align:center;font-weight:800;font-size:20px;margin-bottom:4px}
h1{font-size:27px;margin:4px 0}
.sub{color:#667085;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.full{grid-column:1/-1}
.field{margin-bottom:13px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
input,select{width:100%;height:49px;border:1px solid #d0d5dd;border-radius:12px;padding:0 13px;font-size:17px;background:#fff}
small.info{display:block;color:#667085;margin-top:5px}
.result{background:#edf7ee;border-radius:12px;min-height:49px;padding:12px;font-size:18px}
.result b{font-size:22px}
button{border:0;border-radius:12px;min-height:48px;padding:0 16px;font-size:16px;font-weight:700}
.primary{background:#1677d2;color:#fff;width:100%}
.secondary{background:#e9edf2;color:#172033}
.danger{background:#fee4e2;color:#b42318}
.row{display:flex;gap:9px;margin-top:10px}
.row button{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{background:#f7f8fa;border-radius:12px;padding:12px}
.stat small{color:#667085}
.stat b{display:block;font-size:19px;margin-top:3px}
.saved{display:none;background:#edf7ee;color:#166534;border-radius:10px;padding:10px;margin-bottom:12px;font-weight:700}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1200px}
th,td{padding:9px 7px;border-bottom:1px solid #eaecf0;text-align:left;font-size:13px}
th{background:#f8fafc}
.empty{text-align:center;color:#667085;padding:18px}
@media(max-width:520px){
 .grid{display:block}
 .stats{grid-template-columns:1fr 1fr}
 .stats .stat:last-child{grid-column:1/-1}
}
</style>
</head>
<body>
<main>
<section class="card">
<div class="company">Branquinho &amp; Mesquita</div>
<h1>🍎 Registo de Cargas</h1>
<p class="sub">Registo de palotes, kg, tara, maçã e tipo de palote.</p>

<div class="grid">
<div class="field full">
<label>Nome da parcela</label>
<input id="parcela" placeholder="Ex.: Parcela 12">
</div>

<div class="field">
<label>Data</label>
<input id="data" type="date">
</div>

<div class="field">
<label>Matrícula do camião</label>
<select id="matricula">
<option value="">Selecionar matrícula</option>
<option value="04-92-IR">04-92-IR</option>
<option value="QQ-75-72">QQ-75-72</option>
<option value="OUTRA">Outra matrícula</option>
</select>
</div>

<div class="field">
<label>Tipo de maçã</label>
<select id="maca">
<option value="">Selecionar tipo</option>
<option>Gala</option>
<option>Golden</option>
<option>Starking</option>
<option>Reineta</option>
<option>Jeromine</option>
<option>Bravo</option>
<option>Fuji</option>
<option>Golden suprema</option>
<option>Jonagored</option>
<option>Industria</option>
</select>
</div>

<div class="field">
<label>Tipo de palote</label>
<select id="tipoPalote">
<option value="">Selecionar tipo</option>
<option>Plástico 1x1,20</option>
<option>Plástico 1,20x1,20</option>
<option>Madeira 1x1,20</option>
<option>Madeira 1,20x1,20</option>
</select>
<small class="info" id="taraPaloteInfo"></small>
</div>

<div class="field">
<label>N.º de palotes</label>
<input id="palotes" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
</div>

<div class="field">
<label>Kg bruto</label>
<input id="bruto" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0">
</div>

<div class="field">
<label>Tara do camião (kg)</label>
<input id="tara" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0">
</div>

<div class="field">
<label>Kg líquido — só maçã</label>
<div class="result"><b id="liquido">0,00 kg</b></div>
</div>
</div>

<button type="button" class="primary" id="guardarBtn">➕ GUARDAR REGISTO</button>
<div class="row">
<button type="button" class="secondary" id="novoBtn">Novo registo</button>
<button type="button" class="danger" id="apagarTudoBtn">Apagar tudo</button>
</div>
</section>

<section class="card">
<div class="stats">
<div class="stat"><small>Registos</small><b id="totalReg">0</b></div>
<div class="stat"><small>Total palotes</small><b id="totalPal">0</b></div>
<div class="stat"><small>Total kg líquidos</small><b id="totalKg">0,00</b></div>
</div>
</section>

<section class="card">
<h2 style="font-size:20px;margin-top:0">📋 Histórico</h2>
<div class="saved" id="estado"></div>
<div class="scroll">
<table>
<thead>
<tr>
<th>Parcela</th><th>Data</th><th>Hora</th><th>Matrícula</th><th>Maçã</th>
<th>Palote</th><th>Palotes</th><th>Bruto</th><th>Tara camião</th>
<th>Tara palotes</th><th>Líquido maçã</th><th></th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</div>
<div id="vazio" class="empty">Ainda não há registos.</div>
<div class="row"><button type="button" class="primary" id="exportarBtn">⬇️ Exportar CSV</button></div>
</section>
</main>

<script>
"use strict";

const STORAGE_KEY = "branquinho_mesquita_registos_v2";
const TARA_PALETES = {
  "Plástico 1x1,20": 40,
  "Plástico 1,20x1,20": 40,
  "Madeira 1x1,20": 60,
  "Madeira 1,20x1,20": 75
};

const $ = id => document.getElementById(id);

let dados = [];
try {
  const guardado = localStorage.getItem(STORAGE_KEY);
  dados = guardado ? JSON.parse(guardado) : [];
  if (!Array.isArray(dados)) dados = [];
} catch (e) {
  dados = [];
}

function hoje() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  $("data").value = d.getFullYear() + "-" + m + "-" + dia;
}

function numero(id) {
  const n = parseFloat($(id).value);
  return Number.isFinite(n) ? n : 0;
}

function fmt(n) {
  return Number(n).toLocaleString("pt-PT", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function calcular() {
  const bruto = numero("bruto");
  const taraCamiao = numero("tara");
  const palotes = Math.floor(numero("palotes"));
  const taraPalote = TARA_PALETES[$("tipoPalote").value] || 0;
  const taraTotalPalotes = palotes * taraPalote;
  const liquido = bruto - taraCamiao - taraTotalPalotes;

  $("liquido").textContent = fmt(liquido) + " kg";

  if (taraPalote > 0) {
    $("taraPaloteInfo").textContent =
      "Tara por palote: " + fmt(taraPalote) +
      " kg | Tara total: " + fmt(taraTotalPalotes) + " kg";
  } else if ($("tipoPalote").value) {
    $("taraPaloteInfo").textContent =
      "Tara deste tipo ainda está a 0 kg — pode ser alterada no código.";
  } else {
    $("taraPaloteInfo").textContent = "";
  }
}

function guardarDados() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
    const teste = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(teste);
  } catch (e) {
    return false;
  }
}

function novaEntrada() {
  $("parcela").value = "";
  $("palotes").value = "";
  $("bruto").value = "";
  $("tara").value = "";
  $("maca").value = "";
  $("tipoPalote").value = "";
  $("matricula").value = "";
  $("liquido").textContent = "0,00 kg";
  $("taraPaloteInfo").textContent = "";
  hoje();
}

function guardarRegisto() {
  const parcela = $("parcela").value.trim();
  const matricula = $("matricula").value;
  const maca = $("maca").value;
  const tipoPalote = $("tipoPalote").value;
  const palotes = Math.floor(numero("palotes"));
  const bruto = numero("bruto");
  const taraCamiao = numero("tara");

  if (!parcela) { alert("Indique o nome da parcela."); return; }
  if (!matricula) { alert("Selecione a matrícula."); return; }
  if (!maca) { alert("Selecione o tipo de maçã."); return; }
  if (!tipoPalote) { alert("Selecione o tipo de palote."); return; }
  if (palotes < 0 || bruto < 0 || taraCamiao < 0) {
    alert("Os valores não podem ser negativos.");
    return;
  }
  if (bruto < taraCamiao) {
    alert("O kg bruto não pode ser inferior à tara do camião.");
    return;
  }

  const agora = new Date();
  const hora =
    String(agora.getHours()).padStart(2, "0") + ":" +
    String(agora.getMinutes()).padStart(2, "0") + ":" +
    String(agora.getSeconds()).padStart(2, "0");

  const taraPalote = TARA_PALETES[tipoPalote] || 0;
  const taraTotalPalotes = palotes * taraPalote;
  const liquido = bruto - taraCamiao - taraTotalPalotes;

  if (liquido < 0) {
    alert("O peso líquido não pode ser negativo. Verifique os pesos.");
    return;
  }

  const registo = {
    id: Date.now(),
    parcela: parcela,
    data: $("data").value,
    hora: hora,
    matricula: matricula,
    maca: maca,
    tipoPalote: tipoPalote,
    palotes: palotes,
    bruto: bruto,
    taraCamiao: taraCamiao,
    taraPalote: taraPalote,
    taraTotalPalotes: taraTotalPalotes,
    liquido: liquido
  };

  dados.unshift(registo);

  if (!guardarDados()) {
    dados.shift();
    alert("O iPhone não permitiu guardar os dados. Abra esta aplicação diretamente no Safari e tente novamente.");
    return;
  }

  mostrar();

  $("estado").textContent = "✅ Registo guardado às " + hora;
  $("estado").style.display = "block";

  novaEntrada();
}

function apagarRegisto(indice) {
  if (!confirm("Apagar este registo?")) return;
  dados.splice(indice, 1);
  guardarDados();
  mostrar();
}

function apagarTudo() {
  if (!dados.length) return;
  if (!confirm("Apagar TODOS os registos?")) return;
  dados = [];
  guardarDados();
  mostrar();
  $("estado").style.display = "none";
}

function escapar(valor) {
  return String(valor).replace(/[&<>"']/g, function(c) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    }[c];
  });
}

function mostrar() {
  const lista = $("lista");
  lista.innerHTML = "";

  let totalPalotes = 0;
  let totalKg = 0;

  $("vazio").style.display = dados.length ? "none" : "block";

  dados.forEach(function(r, i) {
    totalPalotes += Number(r.palotes) || 0;
    totalKg += Number(r.liquido) || 0;

    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + escapar(r.parcela) + "</td>" +
      "<td>" + escapar(r.data) + "</td>" +
      "<td>" + escapar(r.hora || "-") + "</td>" +
      "<td>" + escapar(r.matricula) + "</td>" +
      "<td>" + escapar(r.maca) + "</td>" +
      "<td>" + escapar(r.tipoPalote) + "</td>" +
      "<td>" + r.palotes + "</td>" +
      "<td>" + fmt(r.bruto) + "</td>" +
      "<td>" + fmt(r.taraCamiao ?? r.tara ?? 0) + "</td>" +
      "<td>" + fmt(r.taraTotalPalotes || 0) + "</td>" +
      "<td><b>" + fmt(r.liquido) + "</b></td>" +
      "<td><button type='button' class='danger' data-index='" + i + "'>Apagar</button></td>";

    lista.appendChild(tr);
  });

  $("totalReg").textContent = dados.length;
  $("totalPal").textContent = totalPalotes.toLocaleString("pt-PT");
  $("totalKg").textContent = fmt(totalKg);
}

function exportar() {
  if (!dados.length) {
    alert("Não existem registos.");
    return;
  }

  let totalKgLiquido = 0;
  let csv = "\uFEFFParcela;Data;Hora;Matrícula;Tipo de maçã;Tipo de palote;N.º palotes;Kg bruto;Tara camião;Tara palotes;Kg líquido maçã\n";

  dados.forEach(function(r) {
    totalKgLiquido += Number(r.liquido) || 0;

    const linha = [
      r.parcela,
      r.data,
      r.hora || "",
      r.matricula,
      r.maca,
      r.tipoPalote,
      r.palotes,
      r.bruto,
      r.taraCamiao ?? r.tara ?? 0,
      r.taraTotalPalotes || 0,
      r.liquido
    ];

    csv += linha.map(function(x) {
      return '"' + String(x).replace(/"/g, '""') + '"';
    }).join(";") + "\n";
  });

  csv += "\nTOTAL KG LÍQUIDOS DE MAÇÃ;" +
    totalKgLiquido.toLocaleString("pt-PT", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + " kg\n";

  const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "registo_cargas_branquinho_mesquita.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
$("bruto").addEventListener("input", calcular);
$("tara").addEventListener("input", calcular);
$("palotes").addEventListener("input", calcular);
$("tipoPalote").addEventListener("change", calcular);

$("matricula").addEventListener("change", function() {
  if (this.value !== "OUTRA") return;

  const outra = prompt("Introduza a matrícula:");
  if (!outra || !outra.trim()) {
    this.value = "";
    return;
  }

  const valor = outra.trim().toUpperCase();
  const option = document.createElement("option");
  option.value = valor;
  option.textContent = valor;
  this.insertBefore(option, this.lastElementChild);
  this.value = valor;
});

$("guardarBtn").addEventListener("click", guardarRegisto);
$("novoBtn").addEventListener("click", novaEntrada);
$("apagarTudoBtn").addEventListener("click", apagarTudo);
$("exportarBtn").addEventListener("click", exportar);

$("lista").addEventListener("click", function(e) {
  const btn = e.target.closest("button[data-index]");
  if (btn) apagarRegisto(Number(btn.dataset.index));
});

hoje();
mostrar();
</script>
</body>
</html>
